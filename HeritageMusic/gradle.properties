# 多模块 + Compose：给 Gradle Daemon 足够堆，避免 OOM；机器内存 ≥16G 可改为 -Xmx6144m
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8

# 并行与缓存（显著缩短增量与全量构建；首次构建仍会较慢属正常）
org.gradle.parallel=true
org.gradle.caching=true
# Windows 下减少「文件变更检测」开销
org.gradle.vfs.watch=true

# 不要人为压低 workers：默认按 CPU 核数调度，比 max=2 快很多
# 若 8G 内存机器频繁 OOM，可改为 org.gradle.workers.max=4

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 使用 Kotlin 编译守护进程（增量编译更快）；若遇 IDE 偶发 Kotlin daemon 异常再改回 in-process
# kotlin.compiler.execution.strategy=in-process

# 真机调试：在 Android Studio 运行配置中选择已连接的 USB/无线调试设备即可，无需模拟器。
