# 放到 ECS：/etc/nginx/conf.d/ilt-web.conf
# 假设仓库在 /opt/intelligent-learning-terminal ，且已执行 cd web && npm run build
# server_name 用公网 IP，避免与系统自带的 default.conf（常为 server_name _）冲突。
server {
    listen 80;
    server_name 39.106.117.118;
    root /opt/intelligent-learning-terminal/web/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location ~* \.(jpg|jpeg|png|gif|webp|ico|svg|mp3|mp4|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
