# 复制到 ECS：/etc/nginx/conf.d/ilt-static.conf（域名与证书路径请自行替换）
# 假设静态文件放在 /var/www/ilt-static/ ，目录内有 images、audio、video

server {
    listen 80;
    server_name _;  # 或你的域名 assets.example.com
    root /var/www/ilt-static;

    # 若只用 IP 访问，可保留 80；正式环境请上 HTTPS 并做 80→443 跳转

    location /images/ {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /audio/ {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location /video/ {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    gzip on;
    gzip_types image/jpeg image/png image/webp audio/mpeg video/mp4 application/json;
}
